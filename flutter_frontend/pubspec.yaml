name: sportverse_ai
description: "SportVerse AI - Sports venue discovery, slot booking, AI recommendations, equipment marketplace, and multi-role platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^10.1.0
  flutter_dotenv: ^5.2.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  fl_chart: ^0.68.0
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
